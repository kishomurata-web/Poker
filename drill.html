<title>40BB SRP ドリル</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --paper:#F6F6F3; --card:#FFFFFF; --sunk:#EDEDE8;
  --line:#DBDBD3; --line-soft:#E8E8E1;
  --text:#1A1E25; --muted:#666E7A; --faint:#8D95A0;
  --brass:#9A6F1E; --brass-soft:#F0E3C4;
  --suit:#B3303C;
  --ok:#3F7D58; --ok-soft:#DDEBE1;
  --again:#A34A3E; --again-soft:#F2DFDB;
  --b0:#B9BDC2; --b1:#D8B978; --b2:#C08E36; --b3:#9A6114; --b4:#6A3A0C;
  --shadow:0 1px 2px rgba(20,24,31,.06), 0 6px 18px rgba(20,24,31,.05);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --ui:"Archivo","Noto Sans JP",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181E; --card:#1C222A; --sunk:#232A34;
    --line:#2E3742; --line-soft:#262E38;
    --text:#E7EAEE; --muted:#98A2AE; --faint:#6E7884;
    --brass:#D9AB55; --brass-soft:#38301E;
    --suit:#E4707A;
    --ok:#63B184; --ok-soft:#1E3128;
    --again:#D2796B; --again-soft:#33221E;
    --b0:#4A535E; --b1:#8A6E33; --b2:#B5883C; --b3:#D0A253; --b4:#E8C877;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --paper:#14181E; --card:#1C222A; --sunk:#232A34;
  --line:#2E3742; --line-soft:#262E38;
  --text:#E7EAEE; --muted:#98A2AE; --faint:#6E7884;
  --brass:#D9AB55; --brass-soft:#38301E;
  --suit:#E4707A;
  --ok:#63B184; --ok-soft:#1E3128;
  --again:#D2796B; --again-soft:#33221E;
  --b0:#4A535E; --b1:#8A6E33; --b2:#B5883C; --b3:#D0A253; --b4:#E8C877;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:var(--ui); font-size:15px; line-height:1.6;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:640px; margin:0 auto; padding-inline:18px; padding-block:22px 64px}

/* ---- instrument bar ---- */
header{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:14px}
h1{
  font-size:17px; font-weight:700; letter-spacing:.01em; margin:0;
  text-wrap:balance;
}
.sub{font-size:12px; color:var(--faint); font-family:var(--mono)}

.stages{display:flex; gap:0; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-bottom:10px}
.stages button{
  flex:1; appearance:none; border:0; border-right:1px solid var(--line);
  background:var(--card); color:var(--muted); font-family:var(--ui);
  font-size:12.5px; font-weight:500; padding:9px 4px; cursor:pointer; line-height:1.35;
}
.stages button:last-child{border-right:0}
.stages button b{display:block; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.06em; color:var(--faint)}
.stages button[aria-selected="true"]{background:var(--brass-soft); color:var(--text)}
.stages button[aria-selected="true"] b{color:var(--brass)}
.stages button:hover:not([aria-selected="true"]){background:var(--sunk)}

.filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.chip{
  appearance:none; border:1px solid var(--line); background:var(--card); color:var(--muted);
  font-family:var(--mono); font-size:11.5px; padding:4px 9px; border-radius:20px; cursor:pointer;
}
.chip[aria-pressed="true"]{border-color:var(--brass); color:var(--brass); background:var(--brass-soft)}

.meter{display:flex; align-items:center; gap:9px; margin-bottom:18px; font-family:var(--mono); font-size:11px; color:var(--faint)}
.meter .track{flex:1; height:3px; background:var(--sunk); border-radius:2px; overflow:hidden}
.meter .fill{height:100%; background:var(--brass); transition:width .3s}

/* ---- drill card ---- */
.q{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:20px 18px; margin-bottom:14px;
}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--brass); margin-bottom:9px;
}
.spot{font-family:var(--mono); font-size:16px; font-weight:600; letter-spacing:-.01em; margin-bottom:3px}
.betrate{font-family:var(--mono); font-size:11.5px; color:var(--faint)}
.cond{
  margin-top:14px; padding-top:13px; border-top:1px solid var(--line-soft);
  font-size:15px; font-weight:500; line-height:1.65; text-wrap:balance;
}
.ask{margin-top:14px; font-size:13px; color:var(--muted)}

/* board */
.board{display:flex; gap:6px; margin-top:14px; flex-wrap:wrap}
.pc{
  font-family:var(--mono); font-size:20px; font-weight:600; line-height:1;
  background:var(--sunk); border:1px solid var(--line); border-radius:5px;
  padding:9px 8px 8px; min-width:40px; text-align:center;
}
.pc.red{color:var(--suit)}
.pc.turn{border-color:var(--brass); background:var(--brass-soft)}
.pc small{display:block; font-size:9px; letter-spacing:.08em; color:var(--faint); margin-top:3px; font-weight:400}

/* ---- answer ---- */
.a{
  background:var(--card); border:1px solid var(--line); border-radius:10px;
  box-shadow:var(--shadow); padding:18px; margin-bottom:14px;
}
.a h3{
  font-family:var(--mono); font-size:11px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--faint); font-weight:600; margin:0 0 11px;
}
.a h3+*{margin-top:0}
.a section+section{margin-top:20px; padding-top:18px; border-top:1px solid var(--line-soft)}

/* frequency instrument */
.freqbar{display:flex; height:26px; border-radius:4px; overflow:hidden; margin-bottom:9px; background:var(--sunk)}
.freqbar span{display:block}
.freqnums{display:grid; grid-template-columns:repeat(5,1fr); gap:5px; font-family:var(--mono); font-size:11px}
.freqnums div{text-align:center}
.freqnums .v{font-size:17px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.25}
.freqnums .k{color:var(--faint); font-size:10px; letter-spacing:.02em}
.swatch{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:3px; vertical-align:baseline}

.tagrow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:13px}
.tag{
  font-family:var(--mono); font-size:11.5px; padding:3px 9px; border-radius:4px;
  background:var(--brass-soft); color:var(--brass); font-weight:600;
}
.bands{font-family:var(--mono); font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}

/* play lines */
.play{display:flex; flex-direction:column; gap:9px}
.line{display:grid; grid-template-columns:66px 1fr; gap:11px; align-items:start}
.act{
  font-family:var(--mono); font-size:13.5px; font-weight:600; text-align:right;
  padding-top:1px; font-variant-numeric:tabular-nums;
}
.bk{font-size:13px; line-height:1.55; color:var(--text)}
.bk em{font-style:normal; color:var(--faint); font-family:var(--mono); font-size:11px; margin-left:5px}

/* grading */
.grade{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.grade button, .reveal{
  appearance:none; border:1px solid var(--line); border-radius:8px; cursor:pointer;
  font-family:var(--ui); font-size:14px; font-weight:600; padding:13px 10px;
  background:var(--card); color:var(--text);
}
.reveal{width:100%; border-color:var(--brass); color:var(--brass); background:var(--brass-soft)}
.grade .no{border-color:var(--again); color:var(--again); background:var(--again-soft)}
.grade .yes{border-color:var(--ok); color:var(--ok); background:var(--ok-soft)}
.grade button kbd, .reveal kbd{
  font-family:var(--mono); font-size:10px; font-weight:400; opacity:.65; margin-left:6px;
  border:0; background:none; padding:0;
}
button:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

.done{text-align:center; padding:34px 18px; color:var(--muted)}
.done b{display:block; font-size:16px; color:var(--text); margin-bottom:6px}
.linkish{
  appearance:none; background:none; border:0; color:var(--brass); cursor:pointer;
  font-family:var(--ui); font-size:13px; text-decoration:underline; padding:4px;
}

/* reference list */
.ref{margin-top:8px}
.ref details{border:1px solid var(--line); border-radius:9px; background:var(--card); margin-bottom:8px; overflow:hidden}
.ref summary{
  cursor:pointer; padding:11px 14px; font-family:var(--mono); font-size:13px; font-weight:600;
  display:flex; justify-content:space-between; gap:10px; align-items:baseline;
}
.ref summary::-webkit-details-marker{display:none}
.ref summary span{font-size:11px; color:var(--faint); font-weight:400}
.ref .body{padding:0 14px 14px; border-top:1px solid var(--line-soft)}
.ref .r{padding-top:13px}
.ref .r+.r{margin-top:13px; border-top:1px solid var(--line-soft)}
.ref .rl{font-size:13.5px; font-weight:500; margin-bottom:8px; line-height:1.55}
.ref .n{font-family:var(--mono); font-size:11px; color:var(--faint); font-weight:400}

.foot{margin-top:26px; font-size:11.5px; color:var(--faint); line-height:1.7}
.foot code{font-family:var(--mono); font-size:11px}
@media (max-width:430px){
  .line{grid-template-columns:58px 1fr; gap:9px}
  .freqnums .v{font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const SPOTS = DATA.spots;

/* ---------------- board maths ----------------
   The same predicates the tables were cut on, so stage 3 can be asked
   of any board rather than only the ones that were solved. */
const RANKS = '23456789TJQKA';
const SUITS = ['s','h','d','c'];
const SUIT_GLYPH = {s:'♠', h:'♥', d:'♦', c:'♣'};
const RV = r => RANKS.indexOf(r);
const T = RV('T'), A = RV('A');

const WINDOWS = [];
for (let lo = 0; lo <= 8; lo++) WINDOWS.push(new Set([lo, lo+1, lo+2, lo+3, lo+4]));
WINDOWS.push(new Set([A, RV('2'), RV('3'), RV('4'), RV('5')]));   // the wheel
const inWindow = rs => WINDOWS.some(w => rs.every(r => w.has(r)));
const sd = (x, y) => WINDOWS.some(w => w.has(x) && w.has(y));
const counts = xs => { const m = {}; xs.forEach(x => m[x] = (m[x]||0)+1); return m; };
const most = m => Math.max(...Object.values(m));

function flopFeat(cards){
  const r = cards.map(c => RV(c[0])).sort((a,b) => b-a);
  const s = cards.map(c => c[1]);
  const sc = counts(s), rc = counts(r);
  const paired = most(rc) >= 2;
  const wheelCards = r.filter(x => x === A || x <= RV('5')).length;
  const wheel = wheelCards >= 2 && r.every(x => x === A || x <= RV('9'));
  return {
    hi:r[0], mid:r[1], lo:r[2],
    pair:paired, pairhi: paired && r[0] === r[1],
    mono: most(sc) === 3, rain: most(sc) === 1,
    hmsd: sd(r[0], r[1]), mlsd: sd(r[1], r[2]),
    hmml: sd(r[0], r[1]) && sd(r[1], r[2]),
    str: !paired && inWindow(r),
    wheel, wmade: wheel && r[0] === A && inWindow(r),
    run3: r[0] === r[1]+1 && r[1] === r[2]+1,
    nT: r.filter(x => x >= T).length,
    ghm: r[0]-r[1], gml: r[1]-r[2]
  };
}

function turnFeat(flop, card){
  const fr = flop.map(c => RV(c[0])).sort((a,b) => b-a);
  const fs = flop.map(c => c[1]);
  const tr = RV(card[0]), ts = card[1];
  const all = fr.concat([tr]), allS = fs.concat([ts]);
  const sc = counts(allS), fsc = counts(fs);
  const fpair = new Set(fr).size < 3;
  const fmono = most(fsc) === 3, frain = most(fsc) === 1;
  const uniq = [...new Set(all)].sort((a,b) => a-b);
  let run3 = false;
  for (let i = 0; i + 2 < uniq.length; i++)
    if (uniq[i]+1 === uniq[i+1] && uniq[i]+2 === uniq[i+2]) run3 = true;
  return {
    fpair, fmono, frain,
    fstr: !fpair && inWindow(fr),
    pnow: new Set(all).size < 4,
    tpair: !fpair && fr.indexOf(tr) >= 0,
    flush: most(sc) >= 3,
    tflush: !fmono && most(fsc) === 2 && sc[ts] === 3,
    four: fmono && sc[ts] === 4,
    fdrain: frain && sc[ts] === 2,
    over: tr > fr[0], phi: tr === fr[0], plo: tr === fr[2],
    run3,
    f4str: uniq.length === 4 && inWindow(uniq),
    nT: all.filter(x => x >= T).length,
    fhi:fr[0], fmid:fr[1], flo:fr[2], turn:tr,
    ghm: fr[0]-fr[1], gml: fr[1]-fr[2]
  };
}

/* A condition is [family, wanted, value]: value null asks the boolean
   family, a number asks whether the quantity reaches it. */
const holds = (f, c) => {
  const [fam, want, val] = c;
  const got = val === null ? !!f[fam] : f[fam] >= val;
  return got === want;
};
const matches = (f, rule) => rule.cond.every(c => holds(f, c));

function deal(n){
  const deck = [];
  for (const r of RANKS) for (const s of SUITS) deck.push(r + s);
  const out = [];
  for (let i = 0; i < n; i++) out.push(deck.splice(Math.floor(Math.random()*deck.length), 1)[0]);
  return out;
}
/* A board this spot's rules actually sort; near-instant, but bounded. */
function dealFor(spot){
  for (let i = 0; i < 400; i++){
    const cards = deal(spot.street === 'flop' ? 3 : 4);
    const flop = cards.slice(0,3);
    const f = spot.street === 'flop' ? flopFeat(flop) : turnFeat(flop, cards[3]);
    const hit = spot.rules.find(r => matches(f, r));
    if (hit) return {cards, rule:hit};
  }
  return null;
}

/* ---------------- progress ----------------
   Kept in the artifact's own store so it follows the account rather than
   the browser; localStorage carries it when the store is not reachable. */
const BOXES = [0, 6e4, 864e5, 2592e5, 6048e5, 18144e5];   // now, 1m, 1d, 3d, 7d, 21d
let prog = {};
let store = null;
const LS = 'srp40.progress.v1';

function loadLocal(){
  try { prog = JSON.parse(localStorage.getItem(LS) || '{}'); } catch (e) { prog = {}; }
}
function saveLocal(){
  try { localStorage.setItem(LS, JSON.stringify(prog)); } catch (e) {}
}
let saveTimer = null;
function save(){
  saveLocal();
  if (!store) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    store.set({cards: prog, at: Date.now()}).catch(() => {});
  }, 800);
}
(async function connect(){
  const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
  if (!db) return;
  store = db.doc('progress/main');
  try {
    const snap = await store.get();
    const remote = snap.exists ? (snap.data().cards || {}) : null;
    if (remote){
      for (const k in remote)
        if (!prog[k] || (remote[k].due || 0) > (prog[k].due || 0)) prog[k] = remote[k];
      saveLocal(); render();
    }
  } catch (e) {}
})();

const idOf = (spot, rule, stage) => spot.name + '|' + rule.label + '|' + stage;
const cardsFor = stage => {
  const out = [];
  for (const s of SPOTS){
    if (!passes(s)) continue;
    for (const r of s.rules){
      if (stage === 2 && !r.play.length) continue;
      if (stage === 3 && s.rules.length < 2) continue;   // nothing to tell apart
      out.push({spot:s, rule:r, stage, id: idOf(s, r, stage)});
    }
  }
  return out;
};

/* ---------------- session ---------------- */
let stage = 1, shown = false, queue = [], current = null, generated = null;
const filters = {street:'all', pair:'all'};
const PAIRS = [...new Set(SPOTS.map(s => s.pair))];
const passes = s =>
  (filters.street === 'all' || filters.street === s.street) &&
  (filters.pair === 'all' || filters.pair === s.pair);

function due(c){ const p = prog[c.id]; return !p ? -1 : (p.due || 0); }
function build(){
  const now = Date.now();
  const all = cardsFor(stage);
  const fresh = all.filter(c => !prog[c.id]);
  const ready = all.filter(c => prog[c.id] && (prog[c.id].due || 0) <= now)
                   .sort((a,b) => due(a) - due(b));
  queue = ready.concat(shuffle(fresh));
  if (!queue.length) queue = shuffle(all.slice());
  return all.length;
}
function shuffle(a){
  for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function next(){
  if (!queue.length) build();
  current = queue.shift() || null;
  shown = false;
  generated = current && current.stage === 3 ? dealFor(current.spot) : null;
  if (current && current.stage === 3 && generated) current = {...current, rule: generated.rule,
    id: idOf(current.spot, generated.rule, 3)};
  render();
}
function grade(ok){
  if (!current) return;
  const p = prog[current.id] || {box:0};
  p.box = ok ? Math.min(BOXES.length-1, (p.box||0)+1) : 0;
  p.due = Date.now() + BOXES[p.box];
  p.seen = (p.seen||0)+1;
  prog[current.id] = p;
  save(); next();
}

/* ---------------- rendering ---------------- */
const SLOTS = ['check','~33%','50%','75%','125%~'];
const SLOT_VAR = ['--b0','--b1','--b2','--b3','--b4'];
const esc = t => String(t).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function freqHTML(v){
  const bar = v.map((x,i) => x > 0
    ? `<span style="width:${x}%;background:var(${SLOT_VAR[i]})"></span>` : '').join('');
  const nums = v.map((x,i) =>
    `<div><div class="v"${x===0?' style="color:var(--faint)"':''}>${x}</div>
     <div class="k"><i class="swatch" style="background:var(${SLOT_VAR[i]})"></i>${esc(SLOTS[i])}</div></div>`).join('');
  return `<div class="freqbar">${bar}</div><div class="freqnums">${nums}</div>`;
}
function playHTML(rule){
  if (!rule.play.length) return '<p style="color:var(--faint);font-size:13px;margin:0">—</p>';
  return '<div class="play">' + rule.play.map(g =>
    `<div class="line"><div class="act">${esc(g.act)}</div>
     <div class="bk">${esc(g.buckets.join('、'))}<em>${Math.round(g.share*100)}%</em></div></div>`).join('') + '</div>';
}
function boardHTML(cards, street){
  return '<div class="board">' + cards.map((c,i) => {
    const red = c[1] === 'h' || c[1] === 'd';
    const isTurn = street === 'turn' && i === 3;
    return `<div class="pc${red?' red':''}${isTurn?' turn':''}">${esc(c[0])}${SUIT_GLYPH[c[1]]}
      ${isTurn ? '<small>TURN</small>' : '<small>&nbsp;</small>'}</div>`;
  }).join('') + '</div>';
}

function render(){
  const main = document.getElementById('main');
  const foot = document.getElementById('foot');
  document.querySelectorAll('#stages button').forEach(b =>
    b.setAttribute('aria-selected', String(+b.dataset.s === stage)));
  document.getElementById('meter').hidden = stage === 0;

  if (stage === 0){ main.innerHTML = refHTML(); foot.innerHTML = FOOT; return; }
  if (!current){ next(); return; }

  const total = cardsFor(stage).length;
  const learned = cardsFor(stage).filter(c => (prog[c.id]||{}).box >= 2).length;
  document.getElementById('mlabel').textContent = 'box 2以上';
  document.getElementById('mfill').style.width = (total ? learned/total*100 : 0) + '%';
  document.getElementById('mcount').textContent = learned + ' / ' + total;
  const allSeen = Object.keys(prog).length;
  document.getElementById('tally').textContent = allSeen ? allSeen + ' 枚を学習中' : '91ルール / 40スポット';

  if (!total){
    main.innerHTML = `<div class="q"><div class="done"><b>該当するカードがありません</b>
      絞り込みを緩めてください。</div></div>`;
    foot.innerHTML = FOOT; return;
  }
  const {spot, rule} = current;
  let q = `<div class="q">
    <div class="eyebrow">${stage === 3 ? 'どの条件に該当するか' : (stage === 1 ? 'レンジ全体の頻度は' : 'ハンド別の打ち方は')}</div>
    <div class="spot">${esc(spot.name)}</div>
    <div class="betrate">ベット率 ${spot.bet}%${spot.street === 'turn' ? ' · ターン' : ' · フロップ'}</div>`;
  if (stage === 3 && generated){
    q += boardHTML(generated.cards, spot.street);
    q += `<div class="ask">このボードは、${spot.rules.length}本のルールのどれに入るか。</div>`;
  } else {
    q += `<div class="cond">${esc(rule.label)}</div>`;
    q += `<div class="ask">${stage === 1
      ? '（check, ~33%, 50%, 75%, 125%~）とベットの形'
      : '各ハンド区分がとるアクションとサイズ'}</div>`;
  }
  q += '</div>';

  if (!shown){
    q += `<button class="reveal" id="rev">答えを見る<kbd>space</kbd></button>`;
    main.innerHTML = q;
    document.getElementById('rev').onclick = () => { shown = true; render(); };
  } else {
    let a = '<div class="a">';
    if (stage === 3){
      a += `<section><h3>該当する条件</h3><div class="cond" style="margin:0;padding:0;border:0">${esc(rule.label)}</div>
        <div class="tagrow"><span class="bands">${rule.n.toLocaleString()} / ${spot.street === 'flop' ? '22,100' : '2,401'} 通り</span></div></section>`;
      a += `<section><h3>レンジ頻度</h3>${freqHTML(rule.freq)}</section>`;
    } else if (stage === 1){
      a += `<section><h3>レンジ頻度</h3>${freqHTML(rule.freq)}
        <div class="tagrow">${rule.pattern ? `<span class="tag">${esc(rule.pattern)}</span>` : ''}
        ${rule.bands ? `<span class="bands">ナッツ/強/中/弱 ${esc(rule.bands)}</span>` : ''}</div></section>`;
    } else {
      a += `<section><h3>打つなら</h3>${playHTML(rule)}</section>`;
      a += `<section><h3>レンジ頻度（参考）</h3>${freqHTML(rule.freq)}</section>`;
    }
    a += '</div>';
    a += `<div class="grade">
      <button class="no" id="no">もう一度<kbd>1</kbd></button>
      <button class="yes" id="yes">できた<kbd>2</kbd></button></div>`;
    main.innerHTML = q + a;
    document.getElementById('no').onclick = () => grade(false);
    document.getElementById('yes').onclick = () => grade(true);
  }
  foot.innerHTML = FOOT;
}

function refHTML(){
  return '<div class="ref">' + SPOTS.filter(passes).map(s => `
    <details><summary>${esc(s.name)}<span>ベット率 ${s.bet}% · ${s.rules.length}ルール</span></summary>
      <div class="body">${s.rules.map(r => `<div class="r">
        <div class="rl">${esc(r.label)} <span class="n">[${r.n.toLocaleString()}${s.street === 'flop' ? '' : '/2401'}]</span>
        ${r.pattern ? `<span class="n">· ${esc(r.pattern)} ${esc(r.bands)}</span>` : ''}</div>
        ${freqHTML(r.freq)}
        <div style="margin-top:12px">${playHTML(r)}</div>
      </div>`).join('')}</div></details>`).join('') + '</div>';
}

const FOOT = '数字は（check, ~33%, 50%, 75%, 125%~）の5枠。'
  + 'ハンド区分は強い順に ' + DATA.buckets.slice(0,10).join('、')
  + '、ノーペアは ' + DATA.buckets.slice(10).join('、') + '。'
  + '<br>進捗はこのアーティファクトに保存され、端末をまたいで引き継がれます。';

/* ---------------- chrome ---------------- */
function drawFilters(){
  const el = document.getElementById('filters');
  const mk = (label, group, val) =>
    `<button class="chip" data-g="${group}" data-v="${val}" aria-pressed="${filters[group]===val}">${esc(label)}</button>`;
  el.innerHTML = mk('全て','street','all') + mk('フロップ','street','flop') + mk('ターン','street','turn')
    + mk('全ペア','pair','all')
    + PAIRS.map(p => mk(p.replace(/_vs_/,' vs ').toLowerCase(),'pair',p)).join('');
  el.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    filters[b.dataset.g] = b.dataset.v;
    drawFilters(); current = null; queue = []; render();
  });
}
document.getElementById('stages').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  stage = +b.dataset.s; current = null; queue = []; render();
};
document.addEventListener('keydown', e => {
  if (stage === 0 || e.metaKey || e.ctrlKey) return;
  if (e.key === ' ' && !shown){ e.preventDefault(); shown = true; render(); }
  else if (shown && (e.key === '1')) grade(false);
  else if (shown && (e.key === '2')) grade(true);
});

loadLocal();
drawFilters();
render();
})();
</script>
